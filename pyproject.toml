[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-ai"
version = "1.0.0"
description = "MİZAN-AI: Political RAG System for Turkish Political Party Documents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Baran Can Ercan", email = "barancanercan@gmail.com"}
]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langchain>=0.3.7",
    "langchain-core>=0.3.17",
    "langchain-community>=0.3.7",
    "langchain-text-splitters>=0.3.2",
    "langchain-chroma>=0.1.4",
    "langchain-ollama>=0.2.0",
    "langchain-huggingface>=0.1.2",
    "langchain-google-genai",
    "chromadb>=0.5.23",
    "sentence-transformers>=3.3.1",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.4",
    "pypdf>=5.1.0",
    "transformers>=4.46.3",
    "torch>=2.5.1",
    "streamlit>=1.31.0",
    "duckduckgo-search>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.17",
    "aiohttp>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "langgraph>=1.0.8",
    "pytest>=7.4.4",
    "pytest-mock>=3.14.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-mock>=3.14.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
src = "src"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
